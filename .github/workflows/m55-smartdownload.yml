name: M55 Bifrost 2 SmartDownload probe

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  smartdownload:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts/m55_smartdownload_probe.py
      - name: Probe Samsung SmartDownload (no firmware download)
        run: python3 scripts/m55_smartdownload_probe.py
      - name: Upload response report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m55-smartdownload-probe
          path: m55-smartdownload-probe.json
          retention-days: 7
          if-no-files-found: warn
