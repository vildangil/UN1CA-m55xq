name: M55 One UI 7 stock image inspection

on:
  workflow_dispatch:
  push:
    branches: [sixteen]
    paths:
      - .github/workflows/m55-stock-inspect.yml

permissions:
  contents: read

concurrency:
  group: m55-stock-inspect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract-stock:
    name: Download and inspect M556BXXS4BYH2
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      M55_STOCK_ZIP: ${{ runner.temp }}/M556BXXS4BYH2.zip
    steps:
      - name: Free runner space for large firmware
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /
          echo 'Stock archive will be downloaded only to this ephemeral GitHub runner.'

      - name: Check out M55 inspection sources
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts/bifrost/BifrostFetch.kt
            scripts/m55_inspect_stock.py

      - name: Prepare Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Prepare native Bifrost SmartDownload
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/zacharee/Bifrost.git bifrost-src
          cp scripts/bifrost/BifrostFetch.kt bifrost-src/desktop/src/jvmMain/kotlin/BifrostFetch.kt
          sed -i 's/mainClass = "MainKt"/mainClass = "BifrostFetchKt"/g' bifrost-src/desktop/build.gradle.kts
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g/' bifrost-src/gradle.properties
          sed -i 's/^org.gradle.parallel=true/org.gradle.parallel=false/' bifrost-src/gradle.properties
          chmod +x bifrost-src/gradlew

      - name: Download exact M55 One UI 7 from Samsung and decrypt in place
        working-directory: bifrost-src
        shell: bash
        timeout-minutes: 110
        run: |
          set -euo pipefail
          ./gradlew :desktop:run --no-daemon --console=plain
          test -s "$M55_STOCK_ZIP"
          file "$M55_STOCK_ZIP"
          df -h /

      - name: Install streaming image-analysis library
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/m55-python"
          "$RUNNER_TEMP/m55-python/bin/python" -m pip install --disable-pip-version-check lz4

      - name: Inspect Odin AP, vbmeta, super, dynamic partitions
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/m55-python/bin/python" scripts/m55_inspect_stock.py \
            "$M55_STOCK_ZIP" out/m55-stock-inspect
          cat out/m55-stock-inspect/summary.txt

      - name: Upload inspection report and selected small stock images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M55-OneUI7-BYH2-images-and-super-metadata
          path: out/m55-stock-inspect/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1

      - name: Summarize actual source and safety scope
        if: always()
        shell: bash
        run: |
          {
            echo '### M55 stock One UI 7 extraction'
            echo '- Requested model: `SM-M556B`'
            echo '- Requested PDA: `M556BXXS4BYH2` (Android 15)'
            echo '- Samsung FUS SmartDownload, native Bifrost client; no external archive URL'
            echo '- The full 8+ GiB firmware is temporary, not uploaded as an artifact'
            echo '- Artifact includes extracted small images (such as vbmeta) and dynamic partition metadata'
            echo '- Super and vendor are inspected in a streaming fashion; full super/vendor images are not preserved by this workflow'
            echo '- **Do not flash** bootloader/vbmeta; nothing is flashed by this job'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f out/m55-stock-inspect/summary.txt ]; then
            echo '#### Partition metadata' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -n 60 out/m55-stock-inspect/summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
