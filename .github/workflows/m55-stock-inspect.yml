name: M55 One UI 7 stock image inspection

on:
  workflow_dispatch:
    inputs:
      retain_raw_images:
        description: "Keep extracted vendor, odm, vendor_dlkm images in GitHub Artifacts (large)"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: m55-stock-inspect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract-stock:
    name: Download and inspect M556BXXS4BYH2
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      M55_STOCK_ZIP: ${{ github.workspace }}/M556BXXS4BYH2.zip
    steps:
      - name: Free runner space for large firmware
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /
          echo 'Stock archive will be downloaded only to this ephemeral GitHub runner.'

      - name: Check out M55 inspection sources
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts/bifrost/BifrostFetch.kt
            scripts/m55_inspect_stock.py
            scripts/m55_extract_dynamic.py
            scripts/m55_audit_vendor.py

      - name: Validate Python extractors before downloading 8 GiB
        shell: bash
        run: |
          python3 -m py_compile \
            scripts/m55_inspect_stock.py \
            scripts/m55_extract_dynamic.py \
            scripts/m55_audit_vendor.py

      - name: Prepare Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Prepare native Bifrost SmartDownload
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/zacharee/Bifrost.git bifrost-src
          cp scripts/bifrost/BifrostFetch.kt bifrost-src/desktop/src/jvmMain/kotlin/BifrostFetch.kt
          sed -i 's/mainClass = "MainKt"/mainClass = "BifrostFetchKt"/g' bifrost-src/desktop/build.gradle.kts
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g/' bifrost-src/gradle.properties
          sed -i 's/^org.gradle.parallel=true/org.gradle.parallel=false/' bifrost-src/gradle.properties
          chmod +x bifrost-src/gradlew

      - name: Download exact M55 One UI 7 from Samsung and decrypt in place
        working-directory: bifrost-src
        shell: bash
        timeout-minutes: 110
        run: |
          set -euo pipefail
          ./gradlew :desktop:run --no-daemon --console=plain
          test -s "$M55_STOCK_ZIP"
          file "$M55_STOCK_ZIP"
          df -h /

      - name: Install streaming image-analysis library
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/m55-python"
          "$RUNNER_TEMP/m55-python/bin/python" -m pip install --disable-pip-version-check lz4

      - name: Inspect Odin AP, vbmeta, super, dynamic partitions
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/m55-python/bin/python" scripts/m55_inspect_stock.py \
            "$M55_STOCK_ZIP" out/m55-stock-inspect
          cat out/m55-stock-inspect/summary.txt

      - name: Install EROFS inspection tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends erofs-utils e2fsprogs

      - name: Extract vendor, odm and vendor_dlkm directly from sparse super
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/m55-python/bin/python" scripts/m55_extract_dynamic.py \
            "$M55_STOCK_ZIP" \
            out/m55-stock-inspect/super_first16MiB.raw \
            "$RUNNER_TEMP/m55-raw-partitions" \
            out/m55-stock-inspect/detailed
          df -h /

      - name: Extract stock vendor and ODM filesystems without mounting
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          for part in vendor odm vendor_dlkm; do
            image="$RUNNER_TEMP/m55-raw-partitions/$part.img"
            dest="$RUNNER_TEMP/m55-unpacked/$part"
            mkdir -p "$dest"
            fs_magic="$(dd if="$image" bs=1 skip=1024 count=4 status=none | od -An -tx1 | tr -d ' \\n')"
            ext4_magic="$(dd if="$image" bs=1 skip=1080 count=2 status=none | od -An -tx1 | tr -d ' \\n')"
            echo "M55_FILESYSTEM $part at1024=$fs_magic ext4_magic=$ext4_magic"
            if [ "$fs_magic" = e2e1f5e0 ]; then
              fsck.erofs --extract="$dest" "$image"
            elif [ "$ext4_magic" = 53ef ]; then
              debugfs -R "rdump / $dest" "$image" 2>&1
            else
              echo "::error::Unsupported $part filesystem: at1024=$fs_magic"
              exit 1
            fi
          done

      - name: Audit M55 vendor blobs, HALs, VINTF, modules and AVB
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 scripts/m55_audit_vendor.py \
            "$RUNNER_TEMP/m55-raw-partitions" \
            "$RUNNER_TEMP/m55-unpacked" \
            out/m55-stock-inspect/detailed \
            out/m55-stock-inspect
          cat out/m55-stock-inspect/detailed/m55_vendor_audit.md

      - name: Preserve vendor and ODM images on GitHub (optional)
        if: ${{ inputs.retain_raw_images }}
        uses: actions/upload-artifact@v4
        with:
          name: M55-OneUI7-BYH2-vendor-odm-vendor_dlkm-raw
          path: ${{ runner.temp }}/m55-raw-partitions/*.img
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload inspection report and selected small stock images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M55-OneUI7-BYH2-images-and-super-metadata
          path: out/m55-stock-inspect/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1

      - name: Summarize actual source and safety scope
        if: always()
        shell: bash
        run: |
          {
            echo '### M55 stock One UI 7 extraction'
            echo '- Requested model: `SM-M556B`'
            echo '- Requested PDA: `M556BXXS4BYH2` (Android 15)'
            echo '- Samsung FUS SmartDownload, native Bifrost client; no external archive URL'
            echo '- The full 8+ GiB firmware is temporary, not uploaded as an artifact'
            echo '- Artifact includes vbmeta, LP metadata, vendor/odm VINTF and HAL inventory and AVB descriptor report'
            echo '- Super is streamed (no 13.6 GB raw super copy); vendor/odm/vendor_dlkm are extracted and audited'
            echo '- **Do not flash** bootloader/vbmeta; nothing is flashed by this job'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f out/m55-stock-inspect/summary.txt ]; then
            echo '#### Partition metadata' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -n 60 out/m55-stock-inspect/summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
