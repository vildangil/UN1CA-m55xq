# Based on salvogiangri/UN1CA .github/workflows/ci.yml (sixteen).
# Deliberate M55 adaptations: one device, manual-only, pinned Samsung Bifrost
# historical downloads, required original patched kernel and audited SEC config.
name: UN1CA CI (Galaxy M55)

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: "CI mode — full build derives hardware features from exact Samsung M55 stock"
        required: true
        default: preflight
        options:
          - preflight
          - stock_custom_images
          - build
      stock_run_id:
        type: string
        description: "Existing successful Samsung M55 stock image inspection run"
        required: true
        default: "40908265068"
      feature_policy:
        type: choice
        description: "M55 SEC policy: strict stops on unknown features; experimental emits UNFLASHABLE target-files for analysis only"
        required: true
        default: experimental
        options:
          - experimental
          - strict
      kernel_source:
        type: choice
        description: "boot chain for build: stock M55 + user's Custom Binary patch, or previously tested image quartet"
        required: true
        default: stock_custom
        options:
          - stock_custom
          - owner_tested

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Run shellcheck
        run: |
          CODE=0
          while IFS= read -r f; do
            shellcheck -e SC1090,SC1091 -s bash "$f" || CODE=1
          done < <(find platform scripts target unica -name "*.sh" -not -name "*ssi.sh" -not -name "config.sh" -not -name "sff.sh")
          exit $CODE

      - name: Verify M55-specific Python and shell configuration
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/m55_prepare_odin_cache.py \
            scripts/m55_verify_kernel_inputs.py scripts/m55_prepare_stock_kernel.py \
            scripts/m55/samsung_custom_binary.py scripts/m55_build_readiness.py \
            scripts/m55_build_stage.py scripts/m55_extract_dynamic.py \
            scripts/m55_extract_donor.py scripts/m55_mix_donor.py \
            scripts/m55_bootstrap_config.py scripts/m55_derive_features.py
          bash -n target/m55xq/config.sh platform/sm7450/config.sh \
            scripts/m55xq_preflight.sh
          bash scripts/m55xq_preflight.sh
          python3 scripts/tests/test_m55_odin_cache.py
          python3 scripts/tests/test_m55_custom_binary.py
          python3 scripts/tests/test_m55_derive_features.py

  generate-matrix:
    name: Generate matrix
    needs: shellcheck
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Generate CI matrix
        id: generate-matrix
        run: |
          matrix="$(find target -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "$matrix"
          test "$matrix" = '["m55xq"]'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Report unresolved original UN1CA device options
        run: |
          python3 scripts/m55_build_readiness.py . out/m55-ci-readiness
          cat out/m55-ci-readiness/m55_build_readiness.json

      - name: Save device config readiness manifest
        uses: actions/upload-artifact@v4
        with:
          name: M55-original-UN1CA-config-readiness
          path: out/m55-ci-readiness/m55_build_readiness.json
          retention-days: 14

  stock-custom-images:
    name: Prepare verified M55 stock Custom Binary images
    if: ${{ inputs.mode == 'stock_custom_images' }}
    needs: [shellcheck, generate-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout owner's exact Samsung Custom Binary source
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/m55/samsung_custom_binary.py
            scripts/m55_prepare_stock_kernel.py

      - name: Download original stock M55 AP small images from successful inspection
        uses: actions/download-artifact@v4
        with:
          name: M55-OneUI7-BYH2-images-and-super-metadata
          repository: ${{ github.repository }}
          run-id: ${{ inputs.stock_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out/m55-original-images

      - name: Run owner's SignerVer02 patcher on verified stock boot/vendor_boot/dtbo
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/m55_prepare_stock_kernel.py \
            --boot-only \
            --kernel-dir out/m55-original-images \
            --output-dir out/m55-stock-custom-boot
          cat > out/m55-stock-custom-boot/DO_NOT_FLASH.txt <<'EOF'
          M55 STOCK CUSTOM BINARY IMAGES — NOT VALIDATED FOR FLASHING.
          This is the original user's SignerVer02 patch applied to M556BXXS4BYH2.
          No bootloader rollback or AVB trust chain has been modified.
          Samsung bootloader/AVB state, kernel ABI and rollback checks are unverified.
          EOF
          cat out/m55-stock-custom-boot/stock_custom_binary_report.json

      - name: Upload stock Custom Binary images and checksums
        uses: actions/upload-artifact@v4
        with:
          name: M55-BYH2-stock-Custom-Binary-BOOT-TEST-ONLY
          path: out/m55-stock-custom-boot/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

  build:
    name: Build
    if: ${{ inputs.mode == 'build' }}
    needs: [shellcheck, generate-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    env:
      UNICA_PINNED_FIRMWARE_ONLY: '1'
      M55_ONEUI7_FIRMWARE: SM-M556B/INS/CACHE
      M55_STOCK_HARDWARE_MODE: '1'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Bootstrap host-tool configuration without guessing final M55 hardware features
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/m55_bootstrap_config.py . "$RUNNER_TEMP/m55-bootstrap-config.sh"
          bash -n "$RUNNER_TEMP/m55-bootstrap-config.sh"
          echo "M55_DEVICE_CONFIG=$RUNNER_TEMP/m55-bootstrap-config.sh" >> "$GITHUB_ENV"
          echo "M55_KERNEL_DIR=$RUNNER_TEMP/m55-kernel" >> "$GITHUB_ENV"
          echo "::notice::This bootstrap config is valid ONLY for build_dependencies and stock firmware extraction, not ROM packaging."

      - name: Set up build environment
        shell: bash
        run: |
          set -euo pipefail
          # Hosted ubuntu-24.04 runners may use an Azure kernel whose
          # linux-modules-extra-$(uname -r) package is not published.
          # Do not make all UN1CA dependencies fail for that optional package.
          echo "M55_RUNNER_KERNEL=$(uname -r)"
          sudo apt-get update -qq
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq --no-install-recommends \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp
          # F2FS is required for the S22 donor; EROFS can also be accessed
          # through UN1CA's fuse.erofs. The host filesystem module check is
          # advisory, not a reason to install nonexistent Azure kernel packages.
          for filesystem in erofs f2fs; do
            if grep -qw "$filesystem" /proc/filesystems; then
              echo "M55_HOST_FILESYSTEM_READY=$filesystem"
            elif sudo modprobe -q "$filesystem" 2>/dev/null && grep -qw "$filesystem" /proc/filesystems; then
              echo "M55_HOST_FILESYSTEM_LOADED=$filesystem"
            else
              echo "::warning::Runner kernel $(uname -r) does not expose $filesystem; extraction may require a different runner kernel or userspace tooling."
              echo "M55_HOST_FILESYSTEM_UNAVAILABLE=$filesystem"
            fi
          done
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        shell: bash
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      - name: Prepare pinned native Samsung Bifrost client
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/zacharee/Bifrost.git bifrost-src
          cp scripts/bifrost/BifrostFetch.kt bifrost-src/desktop/src/jvmMain/kotlin/BifrostFetch.kt
          sed -i 's/mainClass = "MainKt"/mainClass = "BifrostFetchKt"/g' bifrost-src/desktop/build.gradle.kts
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g/' bifrost-src/gradle.properties
          sed -i 's/^org.gradle.parallel=true/org.gradle.parallel=false/' bifrost-src/gradle.properties
          chmod +x bifrost-src/gradlew

      - name: Set up JDK 21 for Bifrost
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      # Replaces only upstream's firmware acquisition, not original UN1CA
      # extraction, module patches, apktool or ROM assembly.
      - name: Download stock firmwares — exact S22 One UI 8 donor
        shell: bash
        timeout-minutes: 110
        env:
          FUS_MODEL: SM-S901E
          FUS_REGION: TUR
          FUS_PDA: S901EXXSEGZH4
          FUS_OUTPUT_ZIP: ${{ runner.temp }}/m55-source-S22.zip
        run: |
          set -euo pipefail
          (cd bifrost-src && ./gradlew :desktop:run --no-daemon --console=plain)
          python3 scripts/m55_prepare_odin_cache.py donor "$FUS_OUTPUT_ZIP" "$ODIN_DIR"
          rm -f "$FUS_OUTPUT_ZIP"
          df -h /

      - name: Extract stock firmwares — original UN1CA S22 donor extractor
        shell: bash
        timeout-minutes: 70
        run: |
          set -euo pipefail
          ./scripts/extract_fw.sh --ignore-target
          test -f "$FW_DIR/SM-S901E_TUR/.extracted"
          df -h /

      - name: Download stock firmwares — exact historical M55 One UI 7 target
        shell: bash
        timeout-minutes: 110
        env:
          FUS_MODEL: SM-M556B
          FUS_REGION: INS
          FUS_PDA: M556BXXS4BYH2
          FUS_OUTPUT_ZIP: ${{ runner.temp }}/m55-target-BYH2.zip
        run: |
          set -euo pipefail
          (cd bifrost-src && ./gradlew :desktop:run --no-daemon --console=plain)
          python3 scripts/m55_prepare_odin_cache.py stock "$FUS_OUTPUT_ZIP" "$ODIN_DIR"
          rm -f "$FUS_OUTPUT_ZIP"
          df -h /

      - name: Extract stock firmwares — original UN1CA M55 target extractor
        shell: bash
        timeout-minutes: 70
        env:
          M55_STOCK_CUSTOM_MODE: ${{ inputs.kernel_source == 'stock_custom' && '1' || '0' }}
          M55_STOCK_DLKM_OUTPUT: ${{ runner.temp }}/m55-stock-original-vendor_dlkm.img
        run: |
          set -euo pipefail
          ./scripts/extract_fw.sh --ignore-source
          test -f "$FW_DIR/SM-M556B_INS/.extracted"
          df -h /

      - name: Audit stock M55 SEC features and apply strict or UNFLASHABLE experimental policy
        shell: bash
        run: |
          set -euo pipefail
          # Default build is an analysis-only experiment: every unsupported
          # feature remains explicitly UNVERIFIED in the evidence JSON.
          policy="${{ inputs.feature_policy }}"
          args=(--fail-on-missing)
          if [[ "$policy" == "experimental" ]]; then
            args+=(--experimental-preview)
            echo "M55_EXPERIMENTAL_FEATURES_ACTIVE=1" >> "$GITHUB_ENV"
            echo "::warning::EXPERIMENTAL: incomplete M55 SEC configuration. Outputs are non-flashable research artifacts."
          elif [[ "$policy" != "strict" ]]; then
            echo "::error::Unexpected M55 feature policy: $policy"
            exit 1
          fi
          python3 scripts/m55_derive_features.py \
            "$FW_DIR/SM-M556B_INS" . out/m55-stock-feature-evidence \
            "${args[@]}"
          test -s out/m55-stock-feature-evidence/m55-derived-features.sh
          echo "M55_DEVICE_CONFIG=$GITHUB_WORKSPACE/out/m55-stock-feature-evidence/m55-derived-features.sh" >> "$GITHUB_ENV"
          echo "M55_STOCK_FEATURES_EXTRACTED_POLICY=$policy"

      - name: Regenerate final original UN1CA config using verified M55 data
        shell: bash
        run: |
          set -euo pipefail
          export M55_DEVICE_CONFIG="$GITHUB_WORKSPACE/out/m55-stock-feature-evidence/m55-derived-features.sh"
          unset M55_BOOTSTRAP_ONLY
          source ./buildenv.sh m55xq
          if grep -q "__M55_UNVERIFIED__" "$OUT_DIR/config.sh"; then
            echo "::error::Temporary bootstrap placeholders leaked into final UN1CA config"
            exit 1
          fi
          sed -e "/Automatically/d" -e 's/"//g' "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "M55_FINAL_VERIFIED_CONFIG_READY"

      - name: Convert exact M55 stock boot chain with owner's tested Samsung Custom Binary tool
        if: ${{ inputs.kernel_source == 'stock_custom' }}
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 scripts/m55_prepare_stock_kernel.py \
            --kernel-dir "$FW_DIR/SM-M556B_INS/kernel" \
            --vendor-dlkm "$RUNNER_TEMP/m55-stock-original-vendor_dlkm.img" \
            --output-dir "$M55_KERNEL_DIR"
          test -s "$M55_KERNEL_DIR/stock_custom_binary_report.json"
          echo "M55_STOCK_CUSTOM_BINARY_SUCCESS"

      - name: Import owner-tested patched boot chain (optional alternative)
        if: ${{ inputs.kernel_source == 'owner_tested' }}
        shell: bash
        env:
          M55_KERNEL_ARCHIVE_URL: ${{ secrets.M55_KERNEL_ARCHIVE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$M55_KERNEL_ARCHIVE_URL" ]; then
            echo "::error::owner_tested mode requires M55_KERNEL_ARCHIVE_URL; choose stock_custom to build from Samsung stock without an image secret."
            exit 1
          fi
          mkdir -p "$M55_KERNEL_DIR"
          curl -fL --retry 3 --max-time 1800 "$M55_KERNEL_ARCHIVE_URL" \
            -o "$RUNNER_TEMP/m55-kernel.zip"
          unzip -j "$RUNNER_TEMP/m55-kernel.zip" \
            boot.img vendor_boot.img dtbo.img vendor_dlkm.img -d "$M55_KERNEL_DIR"
          python3 scripts/m55_verify_kernel_inputs.py "$M55_KERNEL_DIR"
          rm -f "$RUNNER_TEMP/m55-kernel.zip"

      - name: Restore JDK 17 for UN1CA APK/JAR building
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build ROM — original UN1CA make_rom.sh (target-files only)
        shell: bash
        timeout-minutes: 100
        run: |
          set -euo pipefail
          ./scripts/make_rom.sh
          echo "::warning::Target-files package has NOT been boot-tested. Do NOT flash it."

      - name: Verify and checksum UNTESTED UN1CA target-files archive
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(out/m55xq_*target_files.zip)
          if (( ${#archives[@]} != 1 )); then
            echo "::error::Expected exactly one original UN1CA M55 target-files archive; found ${#archives[@]}"
            exit 1
          fi
          unzip -t "${archives[0]}" | tail -n 4
          sha256sum "${archives[0]}" > out/m55xq-target-files.sha256
          cat > out/M55-UNTESTED-DO-NOT-FLASH.txt <<'EOF'
          UN1CA One UI 8 Galaxy M55 experimental target-files.
          UNTESTED. This is not an installable/flashable ROM ZIP.
          Do not flash or install until AVB, VINTF, SELinux, kernel ABI,
          firmware rollback indices and installation assertions are verified.
          EOF
          echo "M55_UN1CA_TARGET_FILES_CREATED_UNTESTED"

      - name: Upload experimental M55 target-files (unflashable, analysis only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M55-UN1CA-OneUI8-UNTESTED-target-files
          path: |
            out/m55xq_*target_files.zip
            out/m55xq-target-files.sha256
            out/M55-UNTESTED-DO-NOT-FLASH.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload M55 stock hardware feature evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M55-OneUI7-real-hardware-feature-evidence
          path: out/m55-stock-feature-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Save original build log metadata, not a flashable ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M55-original-UN1CA-build-logs-NOT-FLASHABLE
          path: |
            out/config.sh
            out/*.log
            out/target/m55xq/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Explain original UN1CA build provenance
        if: always()
        shell: bash
        run: |
          {
            echo "### Original UN1CA CI, adapted only for M55"
            echo "- Original steps retained: shellcheck, target matrix, disk setup, dependencies, extract_fw.sh and make_rom.sh."
            echo "- Pinned source SM-S901E/TUR/S901EXXSEGZH4 (One UI 8)."
            echo "- Pinned target SM-M556B/INS/M556BXXS4BYH2 (One UI 7)."
            echo "- CACHE is a local identifier only; no fake IMEI or serial is sent to Samsung."
            echo "- stock_custom mode uses exact Samsung M55 stock boot/vendor_boot/dtbo with the owner's original SignerVer02 algorithm, and unchanged stock vendor_dlkm."
            echo "- owner_tested alternative validates the previously supplied custom kernel quartet by SHA-256."
            echo "- Device SEC values are derived from exact stock M55 floating_feature.xml and policy file evidence; no feature config secret."
            echo "- Unknown/conflicting M55 SEC fields are published in the evidence artifact; strict policy stops, experimental preview records neutral unverified placeholders."
            echo "- Experimental mode only builds unflashable target-files; flashing or installing these is unsupported."
            echo "- The output is NOT marked bootable or flashable; AVB/VINTF/kernel ABI are not device-tested."
          } >> "$GITHUB_STEP_SUMMARY"
