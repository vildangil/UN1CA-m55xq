name: M55 firmware verification

on:
  push:
    branches: [sixteen]
    paths:
      - '.github/workflows/firmware-check.yml'
      - 'scripts/m55_firmware_probe.py'
      - 'scripts/m55_verify_oneui7.sh'
  workflow_dispatch:
    inputs:
      mode:
        description: Firmware check mode
        type: choice
        required: true
        default: metadata
        options:
          - metadata
          - download-donor
          - verify-m55-oneui7
      m55_csc:
        description: M55 CSC (3 characters, default INS)
        type: string
        required: true
        default: INS

permissions:
  contents: read

concurrency:
  group: firmware-m55-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SRC_DIR: ${{ github.workspace }}
      OUT_DIR: ${{ github.workspace }}/out
      ODIN_DIR: ${{ github.workspace }}/out/odin
      FW_DIR: ${{ github.workspace }}/out/fw
      TOOLS_DIR: ${{ github.workspace }}/out/tools
      M55_CSC: ${{ inputs.m55_csc || 'INS' }}
      M55_ONEUI7_URL: ${{ secrets.M55_ONEUI7_URL }}
      M55_ONEUI7_SHA256: ${{ secrets.M55_ONEUI7_SHA256 }}
    steps:
      - name: Check out only firmware-check sources
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .gitmodules
            scripts
            unica/configs
            external/samloader

      - name: Check Samsung FOTA firmware metadata
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          command: python3 scripts/m55_firmware_probe.py

      - name: Verify download-only helper loading
        shell: bash
        env:
          UNICA_FIRMWARE_ONLY: '1'
        run: |
          set -euo pipefail
          bash -n scripts/download_fw.sh scripts/utils/firmware_utils.sh scripts/utils/common_utils.sh
          bash -c 'source "$SRC_DIR/scripts/utils/firmware_utils.sh"; declare -F GET_LATEST_FIRMWARE; declare -F PARSE_FIRMWARE_STRING'
          echo 'PASS: firmware download helpers load without the full ROM toolchain'

      - name: Install missing host dependencies for donor download
        if: ${{ inputs.mode == 'download-donor' }}
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            attr ffmpeg protobuf-compiler webp
          for cmd in cwebp ffmpeg getfattr protoc; do
            command -v "$cmd"
          done

      - name: Install Samloader for donor download
        if: ${{ inputs.mode == 'download-donor' }}
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init external/samloader
          python3 -m venv "$TOOLS_DIR/venv"
          "$TOOLS_DIR/venv/bin/pip" install --disable-pip-version-check ./external/samloader
          source unica/configs/qssi.sh
          printf 'SOURCE_FIRMWARE=%s\n' "$SOURCE_FIRMWARE" >> "$GITHUB_ENV"

      - name: Download stock firmware (UN1CA S22 donor only)
        if: ${{ inputs.mode == 'download-donor' }}
        env:
          UNICA_FIRMWARE_ONLY: '1'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh --ignore-target

      - name: Verify pinned Galaxy M55 One UI 7 archive
        if: ${{ inputs.mode == 'verify-m55-oneui7' }}
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: bash scripts/m55_verify_oneui7.sh

      - name: Explain validation scope
        if: always()
        shell: bash
        run: |
          {
            echo '### Scope'
            echo '- Firmware tests never flash the device.'
            echo '- Donor download uses FUS latest, which may differ from the pinned UN1CA 8 source.'
            echo '- M55 One UI 7 must be supplied as a pinned archived ZIP; FUS latest is not a substitute.'
            echo '- Full ROM compilation and DSU boot are not performed in this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
